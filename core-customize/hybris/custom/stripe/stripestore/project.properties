# you can put key/value pairs here.
# Use Config.getParameter(..) to retrieve the values during runtime.
stripestore.key=value
# Specifies the location of the spring context file putted automatically to the global platform application context.
stripestore.application-context=stripestore-spring.xml
# enabling or diabling accelerator save cart hook to remove the session cart & fetch a new cart for the user in stripe store
acceleratorservices.commercesavecart.sessioncart.hook.enabled.stripe=true
acceleratorservices.commercesavecart.sessioncart.hook.enabled.stripe-standalone=true
# enabling or disabling accelerator save cart restoration hook to set the saveTime as null before performing a restoration in stripe store
acceleratorservices.commercesavecart.restoration.savetime.hook.enabled.stripe=true
acceleratorservices.commercesavecart.restoration.savetime.hook.enabled.stripe-standalone=true
##########
# This property is used for incrementing the numbering in the suffix of the saved cart name during cloning.
# It starts with number copy 2 and then increments the suffix index for each clone.
commerceservices.clone.savecart.name.regex.stripe=(\\s+\\d*)$
commerceservices.clone.savecart.name.regex.stripe-standalone=(\\s+\\d*)$
# Disables the quote feature for stripe store.
site.quotes.enabled.stripe=false
site.quotes.enabled.stripe-standalone=false
# The ID of the consent that we show at registration page
registration.consent.id.stripe=MARKETING_NEWSLETTER
registration.consent.id.stripe-standalone=MARKETING_NEWSLETTER
# permanent configuration
# When enabled, register a customer need verificationTokenId and verificationTokenCode
otp.customer.registration.enabled.stripe=false
otp.customer.registration.enabled.stripe-standalone=false
otp.customer.registration.enabled.stripe-spa=false
