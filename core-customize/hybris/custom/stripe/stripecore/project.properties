# Default properties for stripecore
stripecore.application-context=stripecore-spring.xml

# Every property below accepts a site override: stripe.<name>.<baseSiteUid>

# Secret keys: set them per environment, never in git
stripe.secret.key=
stripe.publishable.key=
stripe.webhook.secret=

# manual | automatic
stripe.capture.mode=manual

# Payment methods that support manual capture (comma-separated)
# Methods not in this list use automatic capture
stripe.capture.manual.methods=card,paypal,klarna

stripe.statement.descriptor=
stripe.descriptor.suffix=

stripe.webhook.graceperiod.seconds=300
stripe.payment.pending.timeout.seconds=86400
stripe.payment.pending.retry.seconds=300
