# you can put key/value pairs here.
# Use Config.getParameter(..) to retrieve the values during runtime.

stripeocc.key=value

# Stripe exception handling configuration
webservicescommons.resthandlerexceptionresolver.commercewebservices.StripeGenericWebserviceException.logstack=true
webservicescommons.resthandlerexceptionresolver.commercewebservices.StripeGenericWebserviceException.status=400
webservicescommons.resthandlerexceptionresolver.commercewebservices.StripeGenericWebserviceException.messageFormatterType=FORWARD

# Specifies the location of the spring context file added automatically to the global platform application context.
stripeocc.application-context=stripeocc-spring.xml

#Use for generating static swagger documentation
stripeocc.documentation.static.generate=true
ext.stripeocc.extension.webmodule.webroot=/occ/v2
