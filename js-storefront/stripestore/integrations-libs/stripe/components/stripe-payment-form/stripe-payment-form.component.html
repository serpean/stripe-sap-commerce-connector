<ng-container *ngIf="useStripeFlow; else defaultPaymentFlow">
  <div class="stripe-payment-review">
    <section class="stripe-payment-review__form">
      <form class="stripe-payment-card" [formGroup]="form" (ngSubmit)="submit()">
        <h3>{{ 'stripePayment.title' | cxTranslate }}</h3>

        <div
          #paymentElement
          class="payment-element"
          aria-label="Payment details"
        ></div>

        <label class="form-check">
          <input
            type="checkbox"
            class="form-check-input"
            formControlName="savePaymentMethod"
          />
          <span class="form-check-label">
            {{ 'stripePayment.saveForLater' | cxTranslate }}
          </span>
        </label>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit" [disabled]="isLoading">
            <ng-container *ngIf="!isLoading; else loadingState">
              {{ 'stripePayment.payNow' | cxTranslate }}
            </ng-container>
            <ng-template #loadingState>
              <span class="spinner-border spinner-border-sm" role="status"></span>
              {{ 'stripePayment.processing' | cxTranslate }}
            </ng-template>
          </button>
        </div>

        <div class="error" *ngIf="error">
          {{ error | cxTranslate }}
        </div>
      </form>
    </section>

    <aside class="stripe-payment-review__summary" aria-label="Order summary">
      <cx-review-submit></cx-review-submit>
    </aside>
  </div>
</ng-container>

<ng-template #defaultPaymentFlow>
  <cx-payment-method></cx-payment-method>
</ng-template>
